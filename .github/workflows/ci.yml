# CI (TECHNICAL-TASK §9): pipeline tests + data validation, site type-check + build + smoke test,
# Lighthouse on the built pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Validate data files
        run: python -m pipeline.validate
      - name: Tests
        run: python -m pytest -q pipeline

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Smoke test
        run: node scripts/smoke.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Built with indexing on so the SEO audit measures the launch configuration
      # (the deployed pre-launch site is noindex on purpose).
      - name: Build (indexing on)
        run: npm run build
        env:
          INDEXING: "on"
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
