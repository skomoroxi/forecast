# Daily data update (TECHNICAL-TASK §9): fetch prices → forecasts + TA → commit data/** → deploy.
# On any failure nothing is committed or deployed, the site keeps the last good data,
# and GitHub e-mails the repo owner.
name: Daily data update

on:
  schedule:
    - cron: "15 1 * * *" # 01:15 UTC, after the daily FX close
  workflow_dispatch:
    inputs:
      asset:
        description: "Asset id (empty = all enabled assets)"
        required: false
        default: ""
      backfill:
        description: "Reload the full price history"
        type: boolean
        default: false
      allow_jumps:
        description: "Accept a daily move above max_daily_change (after checking it is real)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # inputs go through env, never straight into the script (no injection)
          INPUT_ASSET: ${{ inputs.asset }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
          INPUT_ALLOW_JUMPS: ${{ inputs.allow_jumps }}
        run: |
          args=()
          if [ -n "$INPUT_ASSET" ]; then args+=(--asset "$INPUT_ASSET"); fi
          if [ "$INPUT_BACKFILL" = "true" ]; then args+=(--backfill); fi
          if [ "$INPUT_ALLOW_JUMPS" = "true" ]; then args+=(--allow-jumps); fi
          python -m pipeline.run "${args[@]}"

      - name: Validate data files
        run: python -m pipeline.validate

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes (market closed or no new bar)."
            exit 0
          fi
          git commit -m "data: daily update $(date -u +%F)"
          git push

  # A push made with GITHUB_TOKEN does not start other workflows, so deploy is called here.
  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      deployments: write
