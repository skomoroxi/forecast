# One entry per asset. Adding an asset = adding an entry here (docs/TECHNICAL-TASK.md §5.1)
# plus its SEO headings and editorial text in src/lib/assetContent.ts.
# enabled: false → shown on the hub as "Coming soon", skipped by the pipeline.
#
# calendar: fx = Mon–Fri · crypto = 7 days · nyse = Mon–Fri (exchange holidays not excluded yet)
# max_daily_change: a bigger close-to-close move stops the daily run for a manual check
# unit: what one price refers to (shown as "per troy ounce", "per coin", "per share")

- id: silver
  name: Silver
  code: XAG
  group: Metals
  symbol: XAG/USD
  slug: silver-price-prediction
  keywords:  # top 3 by US search volume (docs/seo/silver.md); must appear in title, H1, H2s
    - silver price forecast 2026
    - silver price prediction
    - silver price predictions for next 5 years
  unit: troy ounce
  currency: USD
  calendar: fx
  has_volume: false
  max_daily_change: 0.35
  source:
    # Twelve Data's free plan does not include XAG/USD (it needs the Grow plan), so silver spot
    # comes from Alpha Vantage (close only) and the daily range is estimated from the SLV ETF.
    primary: alphavantage
    symbol: SILVER
    ohlc_proxy:
      source: twelvedata
      symbol: SLV
    fallback: null
  chart_color: "#8A96A8"
  enabled: true

